# Workflow CI produit par un assistant IA à partir du prompt :
#   "Écris un workflow GitHub Actions pour tester mon projet ML FastAPI avec pytest,
#    vérifier la sécurité et construire l'image Docker."
#
# Il tourne et affiche du vert.
# Votre mission : l'auditer comme si vous deviez l'accepter en production.
# Pour chaque problème trouvé : ligne concernée, risque, correction proposée.

name: CI Pipeline

on: [push, pull_request]

permissions: write-all

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run code tests
        run: pytest tests/test_api.py

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.0/gitleaks_8.18.0_linux_x64.tar.gz | tar -xz
          ./gitleaks detect --verbose

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t velov-api:latest .

      - name: Push image
        run: echo "Image latest pushed to registry"
