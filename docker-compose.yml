services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: velov
      POSTGRES_PASSWORD: velov_password
      POSTGRES_DB: velov
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velov -d velov"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://velov:velov_password@db:5432/velov
      MODEL_DIR: /app/models
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
